org: krojas07work
service: itsm-solicitudes

frameworkVersion: '3'

custom:
  # Authorizer compartido (contrato v1.1, seccion 3). Lo publica itsm-auth en SSM.
  authorizer:
    arn: ${ssm:/itsm/${sls:stage}/authorizer-arn}
    type: token
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 0   # sin cache durante la integracion inicial

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole

  environment:
    # Nombres exactos del contrato: itsm-solicitudes-dev-catalogo / itsm-solicitudes-dev-solicitudes
    TABLE_CATALOGO: ${self:service}-${self:provider.stage}-catalogo
    TABLE_SOLICITUDES: ${self:service}-${self:provider.stage}-solicitudes
    STAGE: ${self:provider.stage}
    # Fase actual (avance 30%): eventos SNS/SQS POSPUESTOS por revision del profesor.
    # publicar_evento() es no-op mientras sea 'false'. NO se resuelve ningun ARN de SNS/SQS
    # desde SSM y NO se crean ARNs placeholder. Se activara en la fase EDA.
    EVENTS_ENABLED: 'false'

package:
  patterns:
    - '!seed/**'
    - '!docs/**'
    - '!tests/**'
    - '!README.md'
    - '!.venv/**'
    - '!venv/**'
    - '!node_modules/**'
    - '!.git/**'
    - '!.serverless/**'
    - '!.env*'
    - '!**/__pycache__/**'
    # Consumidores SQS: codigo futuro, versionado pero fuera del despliegue actual
    - '!src/consumers/**'

# Todas las rutas usan lambda-proxy (default de Serverless v3) + Lambda Authorizer de itsm-auth.
functions:

  # ============================================================
  # CATALOGO  (lectura: todos; escritura: ADMIN)
  # ============================================================
  listarCatalogo:
    handler: src/handlers/catalogo.listar
    description: GET /catalogo - Lista servicios del tenant (paginado)
    events:
      - http:
          path: catalogo
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  crearServicio:
    handler: src/handlers/catalogo.crear
    description: POST /catalogo - Crea servicio (ADMIN)
    events:
      - http:
          path: catalogo
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  editarServicio:
    handler: src/handlers/catalogo.editar
    description: PUT /catalogo/{id} - Edita servicio (ADMIN)
    events:
      - http:
          path: catalogo/{id}
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  # ============================================================
  # SOLICITUDES
  # Flujo: EN_APROBACION -> APROBADA -> COMPLETADA
  #        EN_APROBACION -> RECHAZADA | CANCELADA
  # ============================================================
  crearSolicitud:
    handler: src/handlers/solicitudes.crear
    description: POST /solicitudes - Crea solicitud (EN_APROBACION o APROBADA segun el servicio)
    events:
      - http:
          path: solicitudes
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  listarSolicitudes:
    handler: src/handlers/solicitudes.listar
    description: GET /solicitudes - Lista paginada (filtros estado y solicitante)
    events:
      - http:
          path: solicitudes
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  obtenerSolicitud:
    handler: src/handlers/solicitudes.obtener
    description: GET /solicitudes/{id} - Detalle
    events:
      - http:
          path: solicitudes/{id}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  aprobarSolicitud:
    handler: src/handlers/solicitudes.aprobar
    description: POST /solicitudes/{id}/aprobar - EN_APROBACION -> APROBADA (ADMIN)
    events:
      - http:
          path: solicitudes/{id}/aprobar
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  rechazarSolicitud:
    handler: src/handlers/solicitudes.rechazar
    description: POST /solicitudes/{id}/rechazar - EN_APROBACION -> RECHAZADA con motivo (ADMIN)
    events:
      - http:
          path: solicitudes/{id}/rechazar
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  completarSolicitud:
    handler: src/handlers/solicitudes.completar
    description: POST /solicitudes/{id}/completar - APROBADA -> COMPLETADA (ADMIN/AGENTE)
    events:
      - http:
          path: solicitudes/{id}/completar
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  cancelarSolicitud:
    handler: src/handlers/solicitudes.cancelar
    description: DELETE /solicitudes/{id} - EN_APROBACION -> CANCELADA (solicitante dueno o ADMIN)
    events:
      - http:
          path: solicitudes/{id}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  # NOTA: el consumidor SQS `consumirCambios` (q-solicitudes / cambio.implementado) se retiro
  # del despliegue en esta fase. El codigo sigue en src/consumers/cambios.py para la fase EDA.

# ============================================================
# RECURSOS: TABLAS DYNAMODB (PAY_PER_REQUEST)
# ============================================================
resources:
  Resources:

    TablaCatalogo:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_CATALOGO}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: servicio_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: servicio_id
            KeyType: RANGE

    TablaSolicitudes:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_SOLICITUDES}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: solicitud_id
            AttributeType: S
          - AttributeName: estado_creado          # GSI1: tenant_id + estado#creado_en
            AttributeType: S
          - AttributeName: solicitante_creado     # GSI2: tenant_id + solicitante_id#creado_en
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: solicitud_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: estado_creado
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: solicitante_creado
                KeyType: RANGE
            Projection:
              ProjectionType: ALL